<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cert-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f7f4e8"/>
      <stop offset="100%" stop-color="#e8e2cd"/>
    </linearGradient>
    <linearGradient id="cert-fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe9d5"/>
      <stop offset="100%" stop-color="#cfc7ad"/>
    </linearGradient>
    <radialGradient id="cert-seal" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="55%" stop-color="#f0a800"/>
      <stop offset="100%" stop-color="#a86800"/>
    </radialGradient>
    <linearGradient id="cert-ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e05252"/>
      <stop offset="100%" stop-color="#9c1414"/>
    </linearGradient>
  </defs>

  <!-- Document page with a folded corner -->
  <path d="M13 4 h27 l11 11 v45 H13 Z" fill="url(#cert-paper)" stroke="#8f8a72" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M40 4 l11 11 H40 Z" fill="url(#cert-fold)" stroke="#8f8a72" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Certificate text lines -->
  <rect x="19" y="19" width="24" height="2.4" rx="1.2" fill="#7d8794"/>
  <rect x="19" y="25" width="26" height="1.8" rx="0.9" fill="#bcc3cb"/>
  <rect x="19" y="30" width="20" height="1.8" rx="0.9" fill="#bcc3cb"/>
  <rect x="19" y="35" width="24" height="1.8" rx="0.9" fill="#bcc3cb"/>
  <rect x="19" y="40" width="14" height="1.8" rx="0.9" fill="#bcc3cb"/>

  <!-- Wax-and-gold seal with ribbon tails -->
  <path d="M36 50 l-3 12 6 -3 6 3 -3 -12 Z" fill="url(#cert-ribbon)" stroke="#7d0f0f" stroke-width="1"/>
  <circle cx="39" cy="47" r="9" fill="url(#cert-seal)" stroke="#8a5a00" stroke-width="1.3"/>
  <circle cx="39" cy="47" r="6" fill="none" stroke="#fff3d0" stroke-width="1" stroke-dasharray="1.8 1.8"/>
  <path d="M39 42.5 l1.4 3 3.2 .4 -2.4 2.2 .7 3.2 -2.9 -1.7 -2.9 1.7 .7 -3.2 -2.4 -2.2 3.2 -.4 Z" fill="#fffaea"/>
</svg>
